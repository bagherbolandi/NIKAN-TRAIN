name: Windows installer validation
on:
  push:
    branches: [main, holding-calendar-competency-access]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Clear reports from previous releases
        shell: pwsh
        run: |
          Remove-Item docs/windows-pytest.xml,docs/windows-installer-result.json,docs/windows-network-result.json -ErrorAction SilentlyContinue
      - name: API and workbook tests
        run: |
          python -m pip install -r requirements-network.txt pytest==8.4.2
          python -m pytest -q --junitxml=windows-pytest.xml
      - name: Verify and install the offline executable
        shell: pwsh
        run: ./packaging/windows_installer_smoke.ps1
      - name: Verify network server, clients and encrypted recovery
        shell: pwsh
        run: ./packaging/windows_network_smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NikanTraining-Windows-Validation
          path: |
            windows-pytest.xml
            docs/windows-installer-result.json
            docs/windows-network-result.json
            distribution/NikanTraining-Setup.exe
            distribution/NikanTraining-Setup.exe.sha256
            distribution/NikanTraining-Network-Server-Setup.exe
            distribution/NikanTraining-Network-Server-Setup.exe.sha256
            distribution/NikanTraining-Network-Client-Setup.exe
            distribution/NikanTraining-Network-Client-Setup.exe.sha256
