name: Windows installer validation
on:
  push:
    branches: [nikan-training-windows-20261013]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: API and workbook tests
        run: |
          python -m pip install -r requirements.txt pytest==8.4.2
          python -m pytest -q --junitxml=windows-pytest.xml
      - name: Publish Windows test diagnosis
        if: always()
        shell: pwsh
        run: |
          if (Test-Path windows-pytest.xml) {
            New-Item -ItemType Directory -Force docs | Out-Null
            Copy-Item windows-pytest.xml docs/windows-pytest.xml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/windows-pytest.xml
            git commit -m "Record Windows validation report" --allow-empty
            git pull --rebase origin nikan-training-windows-20261013
            git push origin HEAD:nikan-training-windows-20261013
          }
      - name: Verify and install the offline executable
        shell: pwsh
        run: ./packaging/windows_installer_smoke.ps1
      - name: Publish native installer result
        if: always()
        shell: pwsh
        run: |
          if (Test-Path docs/windows-installer-result.json) {
            git add docs/windows-installer-result.json
            git commit -m "Record native Windows installer result" --allow-empty
            git pull --rebase origin nikan-training-windows-20261013
            git push origin HEAD:nikan-training-windows-20261013
          }
      - uses: actions/upload-artifact@v4
        with:
          name: NikanTraining-Windows-Installer
          path: |
            distribution/NikanTraining-Setup.exe
            distribution/NikanTraining-Setup.exe.sha256
